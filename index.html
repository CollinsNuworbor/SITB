<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITB Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header class="top-bar">
        <h1>SITB</h1>

        <div class="top-icons">
            <button id="languageBtn">🌍</button>
            <button id="shareBtn">📤</button>
            <button id="settingsBtn">⚙️</button>
        </div>
    </header>

    <div class="display">
        <div id="history"></div>
        <input id="screen" type="text" value="0" readonly>
    </div>

    <div class="buttons">

        <button class="operator">AC</button>
        <button class="operator">⌫</button>
        <button class="operator">%</button>
        <button class="operator">÷</button>

        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">×</button>

        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator">−</button>

        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator">+</button>

        <button class="number zero">0</button>
        <button class="number">.</button>
        <button class="equals">=</button>

    </div>

</div>

<!-- SETTINGS -->

<div id="settingsMenu" class="popup">

    <div class="popupHeader">
        <h2>Settings</h2>
        <button id="closeSettings">✕</button>
    </div>

    <button id="darkModeBtn">🌙 Dark Mode</button>
    <button id="themeBtn">🎨 Themes</button>
    <button id="soundBtn">🔊 Sounds</button>
    <button id="vibrationBtn">📳 Vibration</button>
    <button id="aboutBtn">ℹ️ About SITB</button>

</div>

<!-- LANGUAGES -->

<div id="languageMenu" class="popup">

    <div class="popupHeader">
        <h2>Languages</h2>
        <button id="closeLanguage">✕</button>
    </div>

    <input
        id="languageSearch"
        type="text"
        placeholder="Search language...">

    <div id="languageList"></div>

</div>

<script src="script.js"></script>

</body>
</html>
