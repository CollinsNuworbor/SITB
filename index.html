<!DOCTYPE html>
<html>
<head>

<title>SITB Calculator</title>

<link rel="stylesheet" href="style.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>


<body>


<header>

<h1>🧮 SITB Calculator</h1>

<button id="themeBtn">
🌙 Theme
</button>

</header>



<!-- BASIC CALCULATOR -->

<section class="calculator">

<input id="display" readonly>


<div class="buttons">

<button onclick="insert('7')">7</button>
<button onclick="insert('8')">8</button>
<button onclick="insert('9')">9</button>
<button onclick="insert('/')">÷</button>


<button onclick="insert('4')">4</button>
<button onclick="insert('5')">5</button>
<button onclick="insert('6')">6</button>
<button onclick="insert('*')">×</button>


<button onclick="insert('1')">1</button>
<button onclick="insert('2')">2</button>
<button onclick="insert('3')">3</button>
<button onclick="insert('-')">-</button>


<button onclick="insert('0')">0</button>
<button onclick="insert('.')">.</button>
<button onclick="calculate()">=</button>
<button onclick="insert('+')">+</button>


<button onclick="clearDisplay()">C</button>

<button onclick="deleteLast()">⌫</button>

</div>


</section>




<!-- SCIENTIFIC -->

<section>

<h2>🔬 Scientific</h2>

<button onclick="scientific('sin')">sin</button>

<button onclick="scientific('cos')">cos</button>

<button onclick="scientific('tan')">tan</button>

<button onclick="scientific('sqrt')">√</button>

<button onclick="factorial()">x!</button>

</section>




<!-- EXPLAIN -->

<section>

<button onclick="showExplanation()">

🧠 Explain

</button>

</section>





<!-- HISTORY -->

<section>

<h2>📜 History</h2>

<ul id="historyList"></ul>

<button onclick="clearHistory()">

Clear History

</button>


</section>





<!-- V4 CHAMBERS -->

<section class="v4">


<h2>🚀 SITB v4 Tools</h2>



<button onclick="toggleTool('unit')">

📏 Unit Converter +

</button>


<div id="unit" class="toolBox">


<input id="unitValue" placeholder="Value">


<select id="unitFrom">

<option value="km">
Kilometers
</option>

<option value="m">
Meters
</option>

<option value="cm">
Centimeters
</option>

</select>



<select id="unitTo">

<option value="m">
Meters
</option>

<option value="km">
Kilometers
</option>

<option value="cm">
Centimeters
</option>


</select>


<button onclick="convertUnit()">
Convert
</button>


<p id="unitResult"></p>


</div>





<button onclick="toggleTool('equation')">

🧮 Equation Solver +

</button>


<div id="equation" class="toolBox">


<input id="equationInput"
placeholder="x+5=10">


<button onclick="solveEquation()">

Solve

</button>


<p id="equationResult"></p>


</div>







<button onclick="toggleTool('matrix')">

🔢 Matrix Calculator +

</button>


<div id="matrix" class="toolBox">


<input id="matrixA"
placeholder="1,2,3,4">


<input id="matrixB"
placeholder="5,6,7,8">


<button onclick="addMatrix()">

Add

</button>


<p id="matrixResult"></p>


</div>








<button onclick="toggleTool('graph')">

📈 Graph Calculator +

</button>


<div id="graph" class="toolBox">


<button onclick="drawGraph()">

Draw Graph

</button>


<canvas id="graphCanvas"
width="350"
height="250">

</canvas>


</div>



</section>







<!-- PREMIUM -->

<section class="premium">


<h2>💎 SITB Premium</h2>



<button onclick="togglePremium('ai')">

🤖 AI Tutor +

</button>


<div id="ai" class="premium-content">

AI-powered explanations and learning help.

</div>




<button onclick="togglePremium('camera')">

📷 Camera Math +

</button>


<div id="camera" class="premium-content">

Scan math problems.

</div>





<button onclick="togglePremium('voice')">

🎤 Voice Calculator +

</button>


<div id="voice" class="premium-content">

Speak calculations.

</div>





<button onclick="togglePremium('cloud')">

☁️ Cloud Sync +

</button>


<div id="cloud" class="premium-content">

Save your settings anywhere.

</div>





<h3>💰 Plans</h3>


<button>

$10 / Month

</button>


<button>

$120 / Year

</button>



</section>






<button onclick="shareApp()">

📤 Share SITB

</button>




<script src="script.js"></script>


</body>

</html>
