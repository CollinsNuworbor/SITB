<!DOCTYPE html>
<html>

<head>

<title>SITB Advanced Smart Calculator</title>

<link rel="stylesheet" href="style.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>


<body>


<div class="app">


<aside class="sidebar">

<h1>🧮 SITB</h1>

<p>Smart Calculator</p>


<h3>CALCULATORS</h3>

<button onclick="openChamber('standard')">🧮 Standard</button>

<button onclick="openChamber('scientific')">⚗ Scientific</button>

<button onclick="openChamber('solver')">🧠 Advanced Solver</button>

<button onclick="openChamber('aiTutor')">🤖 AI Tutor</button>

<button onclick="openChamber('graphing')">📈 Advanced Graph</button>

<button onclick="openChamber('programmer')">💻 Programmer</button>

<button onclick="openChamber('date')">📅 Date</button>


<hr>


<h3>CONVERTERS</h3>

<button onclick="openChamber('currency')">💲 Currency</button>

<button onclick="openChamber('length')">📏 Length</button>

<button onclick="openChamber('volume')">📦 Volume</button>

<button onclick="openChamber('weight')">⚖ Weight</button>

<button onclick="openChamber('temperature')">🌡 Temperature</button>

<button onclick="openChamber('energy')">🔥 Energy</button>


<hr>


<button onclick="openChamber('premium')">
💎 SITB Premium
</button>


</aside>



<main>


<header>

<h2 id="title">
Standard Calculator
</h2>

<button onclick="toggleDark()">🌙</button>

</header>





<section id="standard" class="chamber">


<h2>🧮 Standard Calculator</h2>


<input id="display" value="0" readonly>


<div class="keys">


<button onclick="clearDisplay()">C</button>

<button onclick="deleteLast()">⌫</button>

<button onclick="insert('%')">%</button>

<button onclick="insert('/')">÷</button>


<button onclick="insert('7')">7</button>

<button onclick="insert('8')">8</button>

<button onclick="insert('9')">9</button>

<button onclick="insert('*')">×</button>


<button onclick="insert('4')">4</button>

<button onclick="insert('5')">5</button>

<button onclick="insert('6')">6</button>

<button onclick="insert('-')">−</button>


<button onclick="insert('1')">1</button>

<button onclick="insert('2')">2</button>

<button onclick="insert('3')">3</button>

<button onclick="insert('+')">+</button>


<button onclick="insert('0')">0</button>

<button onclick="insert('.')">.</button>

<button onclick="calculate()">=</button>


</div>


<button onclick="showExplanation()">
🧠 Explain
</button>


<ul id="historyList"></ul>


</section>





<section id="scientific" class="chamber hidden">


<h2>⚗ Scientific Calculator</h2>


<input id="scientificDisplay" value="0" readonly>


<div class="keys">


<button onclick="sClear()">C</button>

<button onclick="sDelete()">⌫</button>

<button onclick="sInsert('Math.PI')">π</button>

<button onclick="sCalculate()">=</button>


<button onclick="sInsert('7')">7</button>

<button onclick="sInsert('8')">8</button>

<button onclick="sInsert('9')">9</button>

<button onclick="sInsert('/')">÷</button>


<button onclick="sInsert('4')">4</button>

<button onclick="sInsert('5')">5</button>

<button onclick="sInsert('6')">6</button>

<button onclick="sInsert('*')">×</button>


<button onclick="sInsert('1')">1</button>

<button onclick="sInsert('2')">2</button>

<button onclick="sInsert('3')">3</button>

<button onclick="sInsert('-')">−</button>


<button onclick="sInsert('0')">0</button>

<button onclick="sInsert('.')">.</button>

<button onclick="sInsert('+')">+</button>


</div>


<button onclick="sFunction('sin')">sin</button>

<button onclick="sFunction('cos')">cos</button>

<button onclick="sFunction('tan')">tan</button>

<button onclick="sFunction('sqrt')">√</button>

<button onclick="sFunction('log')">log</button>

<button onclick="sFunction('square')">x²</button>

<button onclick="sFunction('cube')">x³</button>

<button onclick="sFunction('factorial')">x!</button>


</section>
